# --- 这一部分就是所谓的 "main"，直接写在文件最开头 ---
# foot.ini
font=Maple Mono NF:size=13, Source Han Sans CN:size=13, Noto Color Emoji:size=13
initial-window-size-chars=100x30
resize-delay-ms=0
pad=2x2                             # 窗口内边距，类似 Kitty
vertical-letter-offset=1              # 微调行高

[environment]
# 这里保持默认即可

[scrollback]
lines=10000                           # 调大滚动行数

[cursor]
style=block
blink=yes
# 颜色放在下方的颜色段落配置

[mouse]
hide-when-typing=yes

[colors-dark]
alpha=0.5
background=1e1e2e
foreground=cdd6f4

# Catppuccin Mocha 调色板
regular0=45475a  # black
regular1=f38ba8  # red
regular2=a6e3a1  # green
regular3=f9e2af  # yellow
regular4=89b4fa  # blue
regular5=f5c2e7  # magenta
regular6=94e2d5  # cyan
regular7=bac2de  # white

bright0=585b70   # bright black
bright1=f38ba8   # bright red
bright2=a6e3a1   # bright green
bright3=f9e2af   # bright yellow
bright4=89b4fa   # bright blue
bright5=f5c2e7   # bright magenta
bright6=94e2d5   # bright cyan
bright7=a6adc8   # bright white

# 光标颜色：前景色 背景色
cursor=1e1e2e f5e0dc

[csd]
preferred=server                      # 隐藏自带标题栏
